
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hersh's Site</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      background-color: black;
      background-image: url('13peaks-theme-superJumbo.jpg');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      background-attachment: fixed;
      color: #00FF00;
      font-family: "Courier New", monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background-color: rgba(0, 0, 0, 0.8);
      padding: 20px 30px;
      border: 2px solid #00FF00;
      border-radius: 8px;
      text-align: center;
      max-width: 600px;
      width: 100%;
      box-sizing: border-box;
    }

    h1, p, a {
      color: #00FF00;
    }

    a {
      text-decoration: none;
      margin: 0 10px;
      font-size: 18px;
    }

    a:hover {
      text-decoration: underline;
    }

    .music-widget {
      margin-top: 25px;
      padding-top: 15px;
      border-top: 1px solid #00FF00;
      text-align: left;
    }

    .music-widget h3 {
      text-align: center;
      font-size: 17px;
      margin-bottom: 20px;
    }

    .track {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #004400;
    }

    .track img {
      width: 45px;
      height: 45px;
      object-fit: cover;
      border-radius: 3px;
    }

    .track-info {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .track-name {
      font-size: 14px;
      font-weight: bold;
    }

    .track-name a {
      font-size: inherit;
      margin: 0;
    }

    .artist {
      font-size: 12px;
      color: #80B080;
      margin-top: 4px;
    }

    .track-time {
      font-size: 11px;
      color: #80B080;
      white-space: nowrap;
    }

    .now-playing {
      background-color: rgba(0, 255, 0, 0.06);
      border: 1px solid #008800;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 4px;
    }

    .now-playing img {
      width: 60px;
      height: 60px;
    }

    .playing-label {
      font-size: 11px;
      margin-bottom: 5px;
    }

    .indicator {
      display: inline-block;
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    .section-label {
      font-size: 11px;
      color: #80B080;
      margin: 15px 0 5px;
      letter-spacing: 1px;
    }

    .lastfm-link {
      text-align: center;
      margin-top: 15px;
    }

    .lastfm-link a {
      font-size: 12px;
    }

    @media (max-width: 480px) {
      .container {
        padding: 15px;
      }

      h1 {
        font-size: 25px;
      }

      a {
        font-size: 14px;
        margin: 0 4px;
      }

      .track-name {
        font-size: 12px;
      }

      .track-time {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Hersh Samdani</h1>

    <p>Website is still undergoing construction.</p>

    <p>
      <a href="https://github.com/hershsam" target="_blank" rel="noopener noreferrer">GitHub</a> |
      <a href="https://linkedin.com/in/hersh-samdani" target="_blank" rel="noopener noreferrer">LinkedIn</a>
    </p>

    <p>
      <a href="about(academic).html" target="_blank" rel="noopener noreferrer">Academic Repository</a> |
      <a href="mediarep.html" target="_blank" rel="noopener noreferrer">Media Repository</a>
    </p>

    <div class="music-widget">

      <h3>♫ Listening Activity</h3>

      <div id="lastfm-tracks">
        Loading listening history...
      </div>

      <div class="lastfm-link">
        <a href="https://www.last.fm/user/Saltyoceanman"
           target="_blank"
           rel="noopener noreferrer">
          View full listening history on Last.fm ↗
        </a>
      </div>

    </div>

  </div>

  <script>
    const apiKey = "5f135238bfe1a7b2ab0444417f740b80";
    const username = "Saltyoceanman";
    const trackLimit = 2;

    function timeAgo(timestamp) {
      if (!timestamp) return "";

      const minutes = Math.max(
        0,
        Math.floor((Date.now() / 1000 - timestamp) / 60)
      );

      if (minutes < 1) return "Just now";
      if (minutes < 60) return `${minutes}m ago`;
      if (minutes < 1440) return `${Math.floor(minutes / 60)}h ago`;

      return `${Math.floor(minutes / 1440)}d ago`;
    }

    function createTrack(track, nowPlaying) {
      const row = document.createElement("div");

      row.className = nowPlaying
        ? "track now-playing"
        : "track";

      const artwork = track.image?.find(
        image => image.size === "large"
      )?.["#text"];

      if (artwork) {
        const image = document.createElement("img");
        image.src = artwork;
        image.alt = "Album artwork";
        row.appendChild(image);
      }

      const info = document.createElement("div");
      info.className = "track-info";

      if (nowPlaying) {
        const label = document.createElement("div");
        label.className = "playing-label";
        label.innerHTML =
          '<span class="indicator">●</span> NOW PLAYING';

        info.appendChild(label);
      }

      const name = document.createElement("div");
      name.className = "track-name";

      const link = document.createElement("a");
      link.textContent = track.name;
      link.href = track.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";

      name.appendChild(link);

      const artist = document.createElement("div");
      artist.className = "artist";
      artist.textContent = track.artist["#text"];

      info.append(name, artist);
      row.appendChild(info);

      if (!nowPlaying) {
        const time = document.createElement("div");
        time.className = "track-time";
        time.textContent = timeAgo(track.date?.uts);

        row.appendChild(time);
      }

      return row;
    }

    async function loadLastFM() {
      const container = document.getElementById("lastfm-tracks");

      const params = new URLSearchParams({
        method: "user.getrecenttracks",
        user: username,
        api_key: apiKey,
        format: "json",
        limit: trackLimit + 1
      });

      try {
        const response = await fetch(
          `https://ws.audioscrobbler.com/2.0/?${params}`,
          { cache: "no-store" }
        );

        if (!response.ok) {
          throw new Error("Request failed");
        }

        const data = await response.json();

        if (data.error) {
          throw new Error(data.message);
        }

        const tracks = data.recenttracks?.track || [];

        container.replaceChildren();

        const nowPlaying = tracks.find(
          track => track["@attr"]?.nowplaying === "true"
        );

        if (nowPlaying) {
          container.appendChild(createTrack(nowPlaying, true));
        } else {
          const status = document.createElement("div");
          status.className = "section-label";
          status.textContent = "○ NOT CURRENTLY LISTENING";

          container.appendChild(status);
        }

        const heading = document.createElement("div");
        heading.className = "section-label";
        heading.textContent = "RECENTLY PLAYED";

        container.appendChild(heading);

        const recentTracks = tracks.filter(
          track => track["@attr"]?.nowplaying !== "true"
        ).slice(0, trackLimit);

        recentTracks.forEach(track => {
          container.appendChild(createTrack(track, false));
        });

        if (!recentTracks.length) {
          const message = document.createElement("p");
          message.textContent = "No recent tracks.";

          container.appendChild(message);
        }

      } catch (error) {
        console.error("Last.fm error:", error);
        container.textContent = "Listening activity unavailable.";
      }
    }

    loadLastFM();
    setInterval(loadLastFM, 30000);
  </script>

</body>
</html>
